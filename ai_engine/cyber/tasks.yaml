data_collection_task:
  description: >
    Query the database to answer: {question}
    
    INSTRUCTIONS:
    1. Determine which tool(s) to call based on the question
    2. Execute the tool(s) with appropriate parameters
    3. Return ALL raw tool outputs without interpretation
    
    DO NOT analyze, summarize, or interpret. Just execute and return data.
    
  expected_output: >
    Raw tool execution results formatted as:
    
    Tool: [tool_name]
    Parameters: [parameters used]
    Results:
    [complete raw output from tool]

data_analysis_task:
  description: >
    Analyze the raw data from the data_collection_task to answer: {question}
    
    You will receive tool outputs. Your job is to:
    1. Extract key numbers (totals, counts, percentages)
    2. Calculate growth rates and comparisons
    3. Identify top items (countries, actors, event types)
    4. Spot trends and patterns
    5. Note any anomalies or significant findings
    
    DO NOT write a full report - just provide structured analysis.
    
  expected_output: >
    Structured analysis including:
    
    ## Key Statistics
    - Total incidents: [number]
    - Top country: [country] ([number] incidents, [X%])
    - Dominant event type: [type] ([X%])
    - Dominant actor type: [type] ([X%])
    
    ## Trends
    - Year-over-year change: [+/-X%]
    
    ## Geographic Patterns
    [Top 5 countries with counts and percentages]
    
    ## Threat Landscape  
    [Event type breakdown]
    [Actor type breakdown]
    
    ## Notable Observations
    [Anything significant]

report_writing_task:
  description: >
    Create a professional cybersecurity analysis report to answer: {question}
    
    You will receive structured analysis from the data_analysis_task.
    Transform it into an executive-ready report.
    
  expected_output: >
    A complete markdown-formatted report with:
    
    # Cyber Incident Analysis Report - [Topic]
    
    ## Executive Summary
    [Direct answer to question + 2-3 key findings]
    
    ## Key Findings  
    [Table or structured list of core statistics]
    
    ## Detailed Analysis
    ### Temporal Trends
    ### Geographic Distribution
    ### Threat Actor Profile  
    ### Event Type Breakdown
    
    ## Strategic Insights
    [4-5 implications and observations]
    
    ## Actionable Recommendations
    | Recommendation | Rationale | Priority |
    
    ## Conclusion
    [Brief wrap-up]
