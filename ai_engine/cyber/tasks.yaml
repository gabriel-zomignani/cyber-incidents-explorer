data_collection_task:
  description: >
    Query the database to answer: {question}
    
    CRITICAL - You MUST call tools with the exact parameters from the question:
    - If question mentions years (e.g., "2020 to 2024"), use start_year=2020, end_year=2024
    - If question mentions a specific year (e.g., "2020"), use year=2020
    - If question mentions regions (NATO, EU, G7, G20), use region="nato", region="eu", etc.
    - If question mentions countries, use country="country_name"
    
    Execute ALL relevant tools and return their complete outputs.
    
  expected_output: >
    Complete raw output from each tool called, including all numbers and statistics.

data_analysis_task:
  description: >
    Analyze the data from data_collection_task to answer: {question}
    
    Extract actual numbers from the tool outputs - DO NOT use placeholders like [number] or [X%].
    Calculate percentages, identify trends, find top items.
    
  expected_output: >
    Analysis with REAL numbers from the data:
    - Total incidents: (actual count)
    - Top countries with counts and percentages
    - Event types with distributions
    - Actor types with distributions
    - Year-over-year trends (if applicable)
    
    ## Notable Observations
    [Anything significant]

report_writing_task:
  description: >
    Create a professional cybersecurity analysis report to answer: {question}
    
    You will receive structured analysis from the data_analysis_task.
    Transform it into an executive-ready report.
    
  expected_output: >
    A complete markdown-formatted report with:
    
    # Cyber Incident Analysis Report - [Topic]
    
    ## Executive Summary
    [Direct answer to question + 2-3 key findings]
    
    ## Key Findings  
    [Table or structured list of core statistics]
    
    ## Detailed Analysis
    ### Temporal Trends
    ### Geographic Distribution
    ### Threat Actor Profile  
    ### Event Type Breakdown
    
    ## Strategic Insights
    [4-5 implications and observations]
    
    ## Actionable Recommendations
    | Recommendation | Rationale | Priority |
    
    ## Conclusion
    [Brief wrap-up]
